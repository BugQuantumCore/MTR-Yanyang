          repository: Yanyang-Technology-Group/Transport-Simulation-Core
          path: Transport-Simulation-Core

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./Minecraft-Transit-Railway

      - name: Build (1.21.4)
        run: |
          ./gradlew :fabric:setupFiles :fabric:test :fabric:build \
            -PmodLoader=fabric \
            -PminecraftVersion=1.21.4
        working-directory: ./Minecraft-Transit-Railway

      - name: Upload Artifacts (1.21.4)
        uses: actions/upload-artifact@v4
        with:
          name: YYMTR-fabric-1.21.4
          path: Minecraft-Transit-Railway/build/release/*.jar
          if-no-files-found: error
