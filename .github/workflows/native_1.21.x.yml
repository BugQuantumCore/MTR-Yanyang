name: Native Vulkan OBJ pipeline (1.21.x)

on:
  push:
    branches: [ '1.21.x' ]
    paths:
      - 'native/**'
      - 'buildSrc/**'
      - 'src/**'
      - 'website/**'
      - 'versions/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'build-fabric.gradle.kts'
      - 'build-neoforge.gradle.kts'
      - '.github/workflows/native_1.21.x.yml'
  pull_request:
    branches: [ '1.21.x' ]
    paths:
      - 'native/**'
      - 'buildSrc/**'
      - 'src/**'
      - 'website/**'
      - 'versions/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'build-fabric.gradle.kts'
      - 'build-neoforge.gradle.kts'
      - '.github/workflows/native_1.21.x.yml'
  workflow_dispatch:

# Rebuild for every authored input to the shipped jars, including resources,
# schemas, websites, version/toolchain properties and Gradle configuration.
# Release configuration/notes are deliberately excluded: they select a completed
# source build and must not change the identity of that build's artifacts.

# ---------------------------------------------------------------------------
# The platform matrix — all eight targets the mod ships in every jar
# (native/<platform>/wrvk.*; see org.mtr.nativeobj.NativeRuntime):
#
#   windows-x64     native, windows-latest (MSVC x64)
#   windows-arm64   native, windows-11-arm  (MSVC ARM64)
#   linux-x64       native, ubuntu-latest
#   linux-arm64     native, ubuntu-24.04-arm
#   macos-arm64     native, macos-26 (Apple Silicon; deployment target 15.0)
#   android-arm64   cross, ubuntu-latest + Android NDK (bionic, API 26)
#   ios-arm64       cross, macos-15-intel + iOS SDK (arm64, ad-hoc signed)
#   ipados-arm64    iPadOS shares the iphoneos platform binary with iOS —
#                   the assemble job copies the ios-arm64 artifact; a
#                   separate platform directory exists because the jar
#                   layout (and NativeRuntime.detectPlatform) name it.
#
# Native jobs run the full ctest suite; cross jobs build the library and
# verify the produced machine type / platform before it is uploaded.
# ---------------------------------------------------------------------------
jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Both CMake and rustc honor this on macOS. Building on a newer image must
    # not silently raise the minimum OS above the previous macos-15 build.
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows-x64
            library: wrvk.dll
            cross: ''
            rustTargets: ''
          - name: windows-arm64
            os: windows-11-arm
            platform: windows-arm64
            library: wrvk.dll
            cross: ''
            rustTargets: ''
          - name: linux-x64
            os: ubuntu-latest
            platform: linux-x64
            library: libwrvk.so
            cross: ''
            rustTargets: ''
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux-arm64
            library: libwrvk.so
            cross: ''
            rustTargets: ''
          - name: macos-arm64
            os: macos-26
            platform: macos-arm64
            library: libwrvk.dylib
            cross: ''
            rustTargets: ''
          - name: android-arm64
            os: ubuntu-latest
            platform: android-arm64
            library: libwrvk.so
            cross: android
            rustTargets: aarch64-linux-android
          - name: ios-arm64
            # Device code is cross-compiled; an Intel runner avoids competing
            # with the native macOS ARM job for the limited ARM runner pool.
            os: macos-15-intel
            platform: ios-arm64
            library: libwrvk.dylib
            cross: ios
            rustTargets: aarch64-apple-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        # CMake drives cargo for the Rust transport core (rust/wrxr); the
        # runners ship a Rust toolchain but pin it explicitly for
        # reproducibility. Cross jobs add the cross std for their triple.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Configure
        if: matrix.cross == ''
        run: cmake -S native -B native/build -DWRVK_BUILD_TESTS=ON

      - name: Locate the Android NDK
        # The ubuntu image ships the SDK + an NDK (ANDROID_NDK_HOME); scan
        # the sdk dir as a fallback and sdkmanager-install r27c if neither
        # exists. The linker wrapper pins --target/-sysroot itself so any
        # rustc version links through the NDK toolchain.
        if: matrix.cross == 'android'
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=""
            if [ -d "$SDK/ndk" ] && [ -n "$(ls "$SDK/ndk" 2>/dev/null)" ]; then
              NDK="$SDK/ndk/$(ls "$SDK/ndk" | sort -V | tail -1)"
            fi
          fi
          if [ -z "$NDK" ]; then
            echo "no preinstalled NDK; installing r27c via sdkmanager"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750702" > /dev/null
            NDK="$SDK/ndk/27.3.13750702"
          fi
          echo "NDK=$NDK"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          printf '#!/bin/sh\nexec "%s/bin/clang" --target=aarch64-linux-android26 --sysroot="%s/sysroot" "$@"\n' \
            "$TOOLCHAIN" "$TOOLCHAIN" > "$RUNNER_TEMP/android-clang.sh"
          chmod +x "$RUNNER_TEMP/android-clang.sh"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$RUNNER_TEMP/android-clang.sh" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Configure (Android)
        if: matrix.cross == 'android'
        run: >
          cmake -S native -B native/build -DWRVK_BUILD_TESTS=OFF
          -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          -DWRXR_TARGET=aarch64-linux-android

      - name: Prepare the iOS cross toolchain
        if: matrix.cross == 'ios'
        # rustc passes the -Wl,-platform_version line itself; the wrapper's
        # only job is selecting the iphoneos SDK for the clang driver.
        run: |
          set -e
          printf '#!/bin/sh\nexec xcrun --sdk iphoneos clang "$@"\n' > "$RUNNER_TEMP/ios-clang.sh"
          chmod +x "$RUNNER_TEMP/ios-clang.sh"
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=$RUNNER_TEMP/ios-clang.sh" >> "$GITHUB_ENV"

      - name: Configure (iOS)
        if: matrix.cross == 'ios'
        # CMAKE_OSX_SYSROOT=iphoneos selects the device SDK explicitly;
        # the deployment target 12.0 keeps the dylib loadable on older
        # devices (the linker default would stamp the SDK version).
        run: >
          cmake -S native -B native/build -DWRVK_BUILD_TESTS=OFF
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DWRXR_TARGET=aarch64-apple-ios

      - name: Build
        run: cmake --build native/build --config Release

      - name: Test
        if: matrix.cross == ''
        working-directory: native/build
        run: ctest -C Release --output-on-failure

      - name: Rust transport suite
        if: matrix.name == 'linux-x64' || matrix.name == 'linux-arm64'
        run: cargo test --release --offline --manifest-path native/rust/wrxr/Cargo.toml

      - name: Verify the Android library
        if: matrix.cross == 'android'
        # readelf aligns its columns — assert with "Machine:.*AArch64", and
        # print the evidence before the assertions so a failure is diagnosable.
        run: |
          set -e
          echo "=== readelf -h ==="
          "$NDK_TOOLCHAIN/bin/llvm-readelf" -h native/build/libwrvk.so
          echo "=== readelf -d ==="
          "$NDK_TOOLCHAIN/bin/llvm-readelf" -d native/build/libwrvk.so
          file native/build/libwrvk.so
          "$NDK_TOOLCHAIN/bin/llvm-readelf" -h native/build/libwrvk.so | grep -q "Machine:.*AArch64" \
            || { echo "not an AArch64 library"; exit 1; }
          if "$NDK_TOOLCHAIN/bin/llvm-readelf" -d native/build/libwrvk.so | grep -q "libc\.so\.6\|libstdc++"; then
            echo "glibc leaked into the Android build (host toolchain misfire)"; exit 1
          fi

      - name: Sign and verify the iOS library
        if: matrix.cross == 'ios'
        # Xcode 15's otool prints the NUMERIC build-version platform
        # ("platform 2"; 1=MACOS 2=IOS 7=IOSSIMULATOR 8=MACCATALYST)
        # unless -v is passed; accept both spellings.
        run: |
          set -e
          codesign --force --sign - native/build/libwrvk.dylib
          echo "=== link command ==="
          cat native/build/CMakeFiles/wrvk.dir/link.txt
          echo "=== otool -L ==="
          otool -L native/build/libwrvk.dylib
          echo "=== lipo ==="
          lipo -info native/build/libwrvk.dylib
          echo "=== load commands (platform/version, verbose) ==="
          otool -lv native/build/libwrvk.dylib | grep -B1 -A5 -E "LC_BUILD_VERSION|LC_VERSION_MIN"
          file native/build/libwrvk.dylib
          lipo -info native/build/libwrvk.dylib | grep -q arm64 || { echo "not arm64"; exit 1; }
          otool -l native/build/libwrvk.dylib | grep -Eq "platform (IOS|2)" \
            || { echo "not an iOS-platform dylib (see the load commands above)"; exit 1; }

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: wrvk-lib-${{ matrix.platform }}
          path: native/build/${{ matrix.library }}
          if-no-files-found: error

      - name: Upload test binaries (linux, for the golden harness)
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: wrvk-test-binaries
          path: |
            native/build/wrobj_tests
            native/build/wrx_tests
            native/build/wrvk_tests

  compile-spirv:
    name: compile-spirv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Validate GLSL
        run: |
          glslangValidator --target-env vulkan1.1 -V native/shaders/entity.vert -o /tmp/entity_cutout.vert.spv
          glslangValidator --target-env vulkan1.1 -V native/shaders/entity.vert -o /tmp/entity_translucent.vert.spv
          glslangValidator --target-env vulkan1.1 -V native/shaders/cutout.frag -o /tmp/entity_cutout.frag.spv
          glslangValidator --target-env vulkan1.1 -V native/shaders/translucent.frag -o /tmp/entity_translucent.frag.spv
          glslangValidator --target-env vulkan1.1 -V native/shaders/beacon.vert -o /tmp/beacon_beam.vert.spv
          glslangValidator --target-env vulkan1.1 -V native/shaders/beacon.frag -o /tmp/beacon_beam.frag.spv
          spirv-val /tmp/entity_cutout.vert.spv
          spirv-val /tmp/entity_cutout.frag.spv
          spirv-val /tmp/entity_translucent.vert.spv
          spirv-val /tmp/entity_translucent.frag.spv
          spirv-val /tmp/beacon_beam.vert.spv
          spirv-val /tmp/beacon_beam.frag.spv

      - name: Upload SPIR-V
        uses: actions/upload-artifact@v4
        with:
          name: wrvk-spirv
          path: /tmp/*.spv

  assemble:
    name: assemble
    needs: [ build-and-test, compile-spirv ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wrvk-lib-*

      - name: Download SPIR-V
        uses: actions/download-artifact@v4
        with:
          path: spirv
          name: wrvk-spirv

      - name: Layout
        # One directory per platform, matching the jar layout
        # (native/<platform>/wrvk.*). iPadOS shares the iPhoneOS platform
        # binary byte-for-byte — same kernel, same SDK — so it is a copy of
        # the ios-arm64 artifact under its own directory.
        run: |
          set -e
          for platform in windows-x64 windows-arm64 linux-x64 linux-arm64 macos-arm64 android-arm64 ios-arm64 ipados-arm64; do
            mkdir -p "natives/$platform"
          done
          cp artifacts/wrvk-lib-windows-x64/wrvk.dll natives/windows-x64/wrvk.dll
          cp artifacts/wrvk-lib-windows-arm64/wrvk.dll natives/windows-arm64/wrvk.dll
          cp artifacts/wrvk-lib-linux-x64/libwrvk.so natives/linux-x64/libwrvk.so
          cp artifacts/wrvk-lib-linux-arm64/libwrvk.so natives/linux-arm64/libwrvk.so
          cp artifacts/wrvk-lib-macos-arm64/libwrvk.dylib natives/macos-arm64/libwrvk.dylib
          cp artifacts/wrvk-lib-android-arm64/libwrvk.so natives/android-arm64/libwrvk.so
          cp artifacts/wrvk-lib-ios-arm64/libwrvk.dylib natives/ios-arm64/libwrvk.dylib
          cp natives/ios-arm64/libwrvk.dylib natives/ipados-arm64/libwrvk.dylib
          cp spirv/*.spv native/shaders/spirv/
          # every file must be present and non-empty
          find natives -type f -size +0c | wc -l | grep -qx 8 || { find natives -type f -ls; exit 1; }
          ls -lR natives
          ls native/shaders/spirv

      - name: Upload assembled natives
        uses: actions/upload-artifact@v4
        with:
          name: wrvk-natives
          path: |
            natives
            native/shaders/spirv

  build-mod:
    name: build-mod
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MTR-Yanyang
        uses: actions/checkout@v4
        with:
          path: Minecraft-Transit-Railway

      - name: Checkout Transport-Simulation-Core (in-repo fork branch)
        uses: actions/checkout@v4
        with:
          # The Yanyang Technology Group optimized TSC, branched into this
          # repository as tsc-1.21.x — every TSC change is a real commit on
          # that branch, so there is no patch to apply at build time.
          repository: BugQuantumCore/MTR-Yanyang
          # Audited passenger lifecycle fixes; immutable for reproducible builds.
          ref: '601876836d8eb4fdf010c6a2ff969dda8ee19b72'
          path: Transport-Simulation-Core

      - name: Download natives
        uses: actions/download-artifact@v4
        with:
          path: Minecraft-Transit-Railway/wr-vk-artifacts
          name: wrvk-natives

      - name: Layout natives into the mod tree
        run: |
          cp -r Minecraft-Transit-Railway/wr-vk-artifacts/natives Minecraft-Transit-Railway/natives
          mkdir -p Minecraft-Transit-Railway/native/shaders/spirv
          cp -r Minecraft-Transit-Railway/wr-vk-artifacts/native/shaders/spirv/. Minecraft-Transit-Railway/native/shaders/spirv/
          find Minecraft-Transit-Railway/natives -type f

      - name: Set up JDK 21 (TSC toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up JDK 25 (mod toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Angular CLI 22 (both websites) requires node >=22.22.3 / >=24.15
          node-version: '24'

      - name: Publish Transport-Simulation-Core to mavenLocal
        run: |
          ./gradlew -p buildSrc publishToMavenLocal --console=plain
          ./gradlew test publishToMavenLocal --console=plain
        working-directory: ./Transport-Simulation-Core

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./Minecraft-Transit-Railway

      - name: Build (natives injected, 1.21.1 + 1.21.4, fabric + neoforge)
        run: |
          for project in 1.21.1-fabric 1.21.1-neoforge 1.21.4-fabric 1.21.4-neoforge; do
            echo "=== :$project ==="
            ./gradlew ":$project:setupFiles" ":$project:test" ":$project:buildAndCollect" --console=plain || exit 1
            # buildAndCollect accumulates into build/release; move each product
            # set aside so the next iteration starts clean
            mkdir -p "wr-vk-release/$project"
            cp build/release/*.jar "wr-vk-release/$project/"
            rm -f build/release/*.jar
          done
        working-directory: ./Minecraft-Transit-Railway

      - name: Verify the packaged natives (all four targets, all eight platforms)
        # Guards the jar-layout contract of org.mtr.nativeobj.NativeRuntime:
        # native/<platform>/<library> and shaders/spirv/*.spv in every
        # release jar for every shipped platform, and their absence from the
        # sources jars when present (NeoForge does not collect a sources jar).
        # Validate exact names and bytes, not just the presence of directories.
        run: |
          set -euo pipefail
          cd Minecraft-Transit-Railway/wr-vk-release
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          libraries = {
              'windows-x64': 'wrvk.dll', 'windows-arm64': 'wrvk.dll',
              'linux-x64': 'libwrvk.so', 'linux-arm64': 'libwrvk.so',
              'macos-arm64': 'libwrvk.dylib', 'android-arm64': 'libwrvk.so',
              'ios-arm64': 'libwrvk.dylib', 'ipados-arm64': 'libwrvk.dylib',
          }
          shaders = {
              f'{name}.{stage}.spv'
              for name in ('beacon_beam', 'entity_cutout', 'entity_translucent')
              for stage in ('vert', 'frag')
          }
          expected = {}
          for platform, library in libraries.items():
              path = Path('../natives') / platform / library
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty native library: {path}')
              expected[f'native/{platform}/{library}'] = hashlib.sha256(path.read_bytes()).digest()
          for shader in sorted(shaders):
              path = Path('../native/shaders/spirv') / shader
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty shader: {path}')
              expected[f'shaders/spirv/{shader}'] = hashlib.sha256(path.read_bytes()).digest()
          if expected['native/ios-arm64/libwrvk.dylib'] != expected['native/ipados-arm64/libwrvk.dylib']:
              raise SystemExit('iPadOS library must be identical to iOS')
          for project in ('1.21.1-fabric', '1.21.1-neoforge', '1.21.4-fabric', '1.21.4-neoforge'):
              jars = [path for path in Path(project).glob('*.jar') if 'sources' not in path.name]
              if len(jars) != 1:
                  raise SystemExit(f'Expected one release jar for {project}, got {len(jars)}')
              with ZipFile(jars[0]) as archive:
                  names = [info.filename for info in archive.infolist() if not info.is_dir()]
                  if len(names) != len(set(names)):
                      raise SystemExit(f'Duplicate file entries in {jars[0]}')
                  packaged = {name for name in names if name.startswith(('native/', 'shaders/spirv/'))}
                  if packaged != set(expected):
                      raise SystemExit(f'Unexpected native/shader file set in {jars[0]}')
                  for name, digest in expected.items():
                      if hashlib.sha256(archive.read(name)).digest() != digest:
                          raise SystemExit(f'Stale packaged artifact: {jars[0]}:{name}')
              for source in Path(project).glob('*sources*.jar'):
                  with ZipFile(source) as archive:
                      if any(name.startswith(('native/', 'shaders/spirv/')) for name in archive.namelist()):
                          raise SystemExit(f'Native/shader binaries leaked into {source}')
              print(f'Verified {jars[0]}: eight libraries and six shaders')
          print('Verified current-run native and shader bytes in all four release jars')
          PY

      - name: Upload packaged regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-test-reports
          path: |
            Minecraft-Transit-Railway/versions/**/build/test-results/test/*.xml
            Transport-Simulation-Core/build/test-results/test/*.xml
            Transport-Simulation-Core/path-computation/build/test-results/test/*.xml
          if-no-files-found: ignore

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: YYMTR-release-jars
          path: |
            Minecraft-Transit-Railway/wr-vk-release/1.21.1-fabric/*
            Minecraft-Transit-Railway/wr-vk-release/1.21.1-neoforge/*
            Minecraft-Transit-Railway/wr-vk-release/1.21.4-fabric/*
            Minecraft-Transit-Railway/wr-vk-release/1.21.4-neoforge/*
          if-no-files-found: error
