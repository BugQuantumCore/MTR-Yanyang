name: Release 1.21.x

# Commit this configuration only after the formal 1.21.x push build succeeds.
# Required: run_id, source_sha, tag, title. Optional: notes, notes_file,
# prerelease. This workflow creates a DRAFT only; verify before publishing.
on:
  push:
    branches: [ '1.21.x' ]
    paths:
      - '.github/release/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-1.21.x
  cancel-in-progress: false

jobs:
  release:
    name: draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release configuration and verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify source, artifact archives and all four packaged jars
        run: python3 .github/scripts/release_verify.py verify --config .github/release/config.json

      - name: Preserve the verified release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance-${{ github.run_id }}
          path: |
            .release-staging/assets/SHA256SUMS
            .release-staging/assets/build-provenance.json
          if-no-files-found: error

      - name: Create exact-source tag and draft release
        run: python3 .github/scripts/release_verify.py draft
