name: Release 1.21.x

# Publishes the jars a completed Native Vulkan OBJ pipeline run produced.
# workflow_dispatch only fires for workflows on the default branch (this
# fork's default is 1.20.x), so the trigger is a push touching
# .github/release/** only: the commit itself carries the parameters —
#
#   .github/release/config.json   {"run_id","tag","title","notes","notes_file"}
#   .github/release/notes.md      optional notes body when notes_file is set
#
# The job downloads that run's artifacts (CI-to-GitHub bandwidth, no
# rebuild), re-verifies the 8-platform jar contract, then drafts a GitHub
# release with the four mod jars + the all-platform natives zip.
# Verify the draft via the API, then publish it.

on:
  push:
    branches: [ '1.21.x' ]
    paths:
      - '.github/release/**'

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: draft-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the release configuration
        run: |
          set -e
          python3 - <<'PY'
          import json
          with open('.github/release/config.json') as f:
              cfg = json.load(f)
          for key in ('run_id', 'tag', 'title'):
              assert cfg.get(key), 'missing config key: ' + key
          notes = cfg.get('notes', '')
          notes_file = cfg.get('notes_file', '')
          if notes_file:
              if not notes_file.startswith('.github/release/'):
                  notes_file = '.github/release/' + notes_file
              with open(notes_file) as f:
                  notes = f.read()
          with open('notes.md', 'w') as f:
              f.write(notes)
          print('config ok; tag:', cfg['tag'], '| notes bytes:', len(notes))
          PY
          echo "RUN_ID=$(python3 -c "import json;print(json.load(open('.github/release/config.json'))['run_id'])")" >> "$GITHUB_ENV"
          echo "TAG=$(python3 -c "import json;print(json.load(open('.github/release/config.json'))['tag'])")" >> "$GITHUB_ENV"
          echo "TITLE=$(python3 -c "import json;print(json.load(open('.github/release/config.json'))['title'])")" >> "$GITHUB_ENV"
          echo "--- notes.md preview ---"
          head -5 notes.md

      - name: Download the release jars
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          name: YYMTR-release-jars
          path: jars
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the natives bundle
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          name: wrvk-natives
          path: natives-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Flatten assets and re-verify the 8-platform contract
        run: |
          set -e
          mkdir -p assets
          find jars -name '*.jar' -not -name '*sources*' -exec cp {} assets/ \;
          platforms="windows-x64 windows-arm64 linux-x64 linux-arm64 macos-arm64 android-arm64 ios-arm64 ipados-arm64"
          [ "$(find assets -name '*.jar' | wc -l)" -eq 4 ] || { find assets -type f; echo "expected exactly 4 release jars"; exit 1; }
          for jar in assets/*.jar; do
            echo "re-verifying $jar"
            for platform in $platforms; do
              unzip -l "$jar" | grep -qE "native/$platform/(lib)?wrvk\.(dll|so|dylib)" \
                || { echo "native library for $platform missing from $jar"; exit 1; }
            done
            unzip -l "$jar" | grep -qE 'shaders/spirv/.+\.spv' || { echo "spirv shaders missing from $jar"; exit 1; }
          done
          (cd natives-artifact && zip -qr "$PWD/../assets/wrvk-natives-all-platforms.zip" natives native)
          sha256sum assets/* | tee assets.sha256

      - name: Create the draft release and upload the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md assets/*
          echo "draft created:"
          gh release view "$TAG" --json name,isDraft,assets --jq '{name, isDraft, assets: [.assets[] | {name, size}]}'
