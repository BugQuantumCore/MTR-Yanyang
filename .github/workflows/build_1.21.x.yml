name: Build 1.21.x

on:
  push:
    branches: [ '1.21.x' ]
  pull_request:
    branches: [ '1.21.x' ]
  workflow_dispatch:

jobs:
  build-mod:
    name: build (${{ matrix.minecraftVersion }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraftVersion: [ '1.21.1', '1.21.4' ]
    steps:
      - name: Checkout MTR-Yanyang
        uses: actions/checkout@v4
        with:
          ref: '1.21.x'
          path: Minecraft-Transit-Railway

      - name: Checkout Transport-Simulation-Core (Yanyang fork)
        uses: actions/checkout@v4
        with:
          repository: Yanyang-Technology-Group/Transport-Simulation-Core
          ref: '8d72d57f8efe594efed9d26e90859e88fd05ed94'  # Yanyang TSC master 8d72d57, pinned for the committed patch
          path: Transport-Simulation-Core

      - name: Apply the TSC CI patches
        # Publishes the build tools under the artifact id MTR resolves and
        # replaces Project.exec (removed in Gradle 9) for the website build.
        run: git apply --3-way ../Minecraft-Transit-Railway/.github/tsc-fork-ci.patch
        working-directory: ./Transport-Simulation-Core

      - name: Set up JDK 21 (TSC toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up JDK 25 (mod toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish Transport-Simulation-Core to mavenLocal
        # The fork has no GitHub Packages credentials for the upstream
        # Minecraft-Transit-Railway packages, so build TSC from the public
        # Yanyang fork and resolve it from mavenLocal instead (see the
        # mavenLocal() entries in buildSrc, build-fabric and build-neoforge).
        run: |
          ./gradlew -p buildSrc publishToMavenLocal --console=plain
          ./gradlew publishToMavenLocal --console=plain
        working-directory: ./Transport-Simulation-Core

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./Minecraft-Transit-Railway

      - name: Build
        # The stonecutter projects are named <version>-<loader>; the upstream
        # workflow's ":fabric:" targets never existed on this branch. The
        # chiseled project names are the first thing `gradlew projects` shows.
        run: |
          ./gradlew :${{ matrix.minecraftVersion }}-fabric:setupFiles :${{ matrix.minecraftVersion }}-fabric:test :${{ matrix.minecraftVersion }}-fabric:buildAndCollect \
            --console=plain
        working-directory: ./Minecraft-Transit-Railway

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YYMTR-fabric-${{ matrix.minecraftVersion }}
          path: Minecraft-Transit-Railway/build/release/*.jar
          if-no-files-found: error
