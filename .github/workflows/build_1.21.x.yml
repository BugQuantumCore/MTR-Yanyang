name: Build 1.21.x

on:
  push:
    branches: [ '1.21.x' ]
  pull_request:
    branches: [ '1.21.x' ]
  workflow_dispatch:

jobs:
  build-mod:
    name: build (${{ matrix.loader }} ${{ matrix.minecraftVersion }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraftVersion: '1.21.1', loader: 'fabric' }
          - { minecraftVersion: '1.21.1', loader: 'neoforge' }
          - { minecraftVersion: '1.21.4', loader: 'fabric' }
          - { minecraftVersion: '1.21.4', loader: 'neoforge' }
    steps:
      - name: Checkout MTR-Yanyang
        uses: actions/checkout@v4
        with:
          ref: '1.21.x'
          path: Minecraft-Transit-Railway

      - name: Checkout Transport-Simulation-Core (in-repo fork branch)
        uses: actions/checkout@v4
        with:
          # The Yanyang Technology Group optimized TSC, branched into this
          # repository as tsc-1.21.x — every TSC change (build plumbing and
          # the easement-curve work) is a real commit on that branch, so
          # there is no patch to apply at build time any more.
          repository: BugQuantumCore/MTR-Yanyang
          ref: 'tsc-1.21.x'
          path: Transport-Simulation-Core

      - name: Set up JDK 21 (TSC toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up JDK 25 (mod toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Angular CLI 22 (both websites) requires node >=22.22.3 / >=24.15
          node-version: '24'

      - name: Publish Transport-Simulation-Core to mavenLocal
        # The fork has no GitHub Packages credentials for the upstream
        # Minecraft-Transit-Railway packages, so build TSC from the in-repo
        # tsc-1.21.x branch and resolve it from mavenLocal instead (see the
        # mavenLocal() entries in buildSrc, build-fabric and build-neoforge).
        run: |
          ./gradlew -p buildSrc publishToMavenLocal --console=plain
          ./gradlew publishToMavenLocal --console=plain
        working-directory: ./Transport-Simulation-Core

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./Minecraft-Transit-Railway

      - name: Build
        # The stonecutter projects are named <version>-<loader>; the upstream
        # workflow's ":fabric:" targets never existed on this branch. The
        # chiseled project names are the first thing `gradlew projects` shows.
        run: |
          ./gradlew :${{ matrix.minecraftVersion }}-${{ matrix.loader }}:setupFiles :${{ matrix.minecraftVersion }}-${{ matrix.loader }}:test :${{ matrix.minecraftVersion }}-${{ matrix.loader }}:buildAndCollect \
            --console=plain
        working-directory: ./Minecraft-Transit-Railway

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YYMTR-${{ matrix.loader }}-${{ matrix.minecraftVersion }}
          path: Minecraft-Transit-Railway/build/release/*.jar
          if-no-files-found: error
