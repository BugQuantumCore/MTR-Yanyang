pluginManagement {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		maven { url = "https://maven.minecraftforge.net/" }
		mavenCentral()
		gradlePluginPortal()
	}
}

final String modLoader = providers.gradleProperty("modLoader").getOrElse("all")
if (!(modLoader in ["fabric", "forge", "all"])) {
	throw new GradleException("modLoader must be fabric, forge, or all")
}
if (modLoader != "forge") include("fabric")
if (modLoader != "fabric") include("forge")

rootProject.name = "Minecraft-Transit-Railway"
